name: SecureShop DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-security:
    name: Tests, SAST, SCA and secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Bandit SAST
        run: python -m bandit -r app

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Semgrep SAST
        run: semgrep scan --config p/python --error app

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2

  container-security:
    name: Build, scan and generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t secureshop:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secureshop:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secureshop:${{ github.sha }}
          format: cyclonedx-json
          output-file: reports/secureshop-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureshop-sbom
          path: reports/secureshop-sbom.json
          if-no-files-found: error

  dynamic-security:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t secureshop:ci .

      - name: Start application
        run: |
          docker run -d --rm \
            --name secureshop-target \
            -p 127.0.0.1:5000:5000 \
            secureshop:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs secureshop-target
          exit 1

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: false

      - name: Stop application
        if: always()
        run: docker stop secureshop-target || true
